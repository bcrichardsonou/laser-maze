name: Software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s development/pi/tests -q
      - run: python -m unittest discover -s development/releases/tests -q
      - run: python -m unittest discover -s development/arduino/tests -q
